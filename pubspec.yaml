name: lost_and_found_app
description: A Flutter + Firebase lost and found application scaffold.
publish_to: "none"

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  firebase_core: ^3.15.2
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.4.2
  firebase_storage: ^12.3.1
  firebase_messaging: ^15.1.0
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  intl: ^0.19.0
  uuid: ^4.5.1
  url_launcher: ^6.2.5
  google_mlkit_image_labeling: ^0.12.0
  http: ^1.2.2
  google_fonts: ^6.2.1
  flutter_local_notifications: ^17.1.2
  palette_generator: ^0.3.3+3
  image: ^4.1.7
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/laf_logo.png

